name: Unbundle release into main
on:
  push:
    branches: [ bootstrap ]
jobs:
  unbundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0-bundletoo --repo ${{ github.repository }} --pattern offroad2.bundle --output offroad2.bundle
      - name: Clone from bundle
        run: git clone offroad2.bundle unbundled
      - name: Push to main
        run: |
          cd unbundled
          git checkout squashed
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push origin squashed:main
